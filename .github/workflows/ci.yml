name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pub workspace contains Flutter packages, so every job resolves it with
# the Flutter SDK (which bundles Dart). The engine itself stays pure Dart.
jobs:
  mail:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - quds_mail_core
          - quds_mail_mime
          - quds_mail_store
          - quds_mail_transport
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Verify browser EWS and IMAP boundary
        if: matrix.package == 'quds_mail_transport'
        run: dart test --platform node test/ews_unsupported_test.dart test/ews_configuration_test.dart test/unsupported_test.dart

  studio_ews:
    name: Studio Exchange mail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quds_office_editor/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter analyze lib/studio_mail_ews.dart lib/studio_mail_native.dart lib/studio_mail_strings.dart test/studio_mail_ews_test.dart
      - run: flutter test test/studio_mail*_test.dart test/studio_saved_mail_test.dart

  engine:
    name: quds_office_engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quds_office_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - name: Analyze vendored legacy DOC parser
        working-directory: packages/legacy_doc_parser
        run: dart analyze
      - name: Test vendored legacy DOC parser
        working-directory: packages/legacy_doc_parser
        run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser oracle test dependencies
        working-directory: packages/legacy_doc_parser
        run: python -m pip install -r tool/fidelity/requirements-test.txt
      - name: Test parser oracle harness
        working-directory: packages/legacy_doc_parser
        run: python -m unittest discover -s tool/fidelity -p 'test_*.py'
      - run: dart analyze --fatal-infos
      - run: dart test

  editor:
    name: quds_office_editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quds_office_editor
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  report_studio:
    name: quds_report_studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quds_report_studio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test
