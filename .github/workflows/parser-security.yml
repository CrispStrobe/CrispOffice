name: Bounded parser qualification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  parser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter pub get --enforce-lockfile
      - name: Parser regressions and bounded fuzzing
        working-directory: packages/quds_office_engine
        run: |
          dart test test/deflate_test.dart test/zip_bounded_read_test.dart test/pdf_filter_expansion_test.dart test/sheet_formula_test.dart test/word_table_nested_layout_test.dart
          dart run tool/fuzz/fuzz_deflate.dart 5000
          dart run tool/fuzz/fuzz_opc.dart 5000
          dart run tool/fuzz/fuzz_pdf.dart 5000
          dart run tool/fuzz/fuzz_xml.dart 5000
