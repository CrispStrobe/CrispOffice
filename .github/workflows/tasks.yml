name: Tasks

'on':
  push:
    branches: [main]
    paths:
      - 'packages/quds_tasks_core/**'
      - 'packages/quds_tasks_graph/**'
      - 'packages/quds_tasks_caldav/**'
      - 'packages/quds_tasks_store/**'
      - 'packages/quds_mail_transport/lib/quds_mail_transport.dart'
      - 'packages/quds_mail_transport/lib/src/cloud/**'
      - 'packages/quds_mail_transport/lib/src/ews/**'
      - 'packages/quds_mail_transport/test/cloud_oauth*_test.dart'
      - 'packages/quds_mail_transport/test/ews*_test.dart'
      - 'packages/quds_mail_transport/test/google_task_reader_test.dart'
      - 'packages/quds_mail_transport/pubspec.yaml'
      - 'packages/quds_office_editor/example/lib/studio_tasks*.dart'
      - 'packages/quds_office_editor/example/lib/suite_workspace.dart'
      - 'packages/quds_office_editor/example/test/studio_tasks_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.fvmrc'
      - '.github/workflows/tasks.yml'
  pull_request:
    paths:
      - 'packages/quds_tasks_core/**'
      - 'packages/quds_tasks_graph/**'
      - 'packages/quds_tasks_caldav/**'
      - 'packages/quds_tasks_store/**'
      - 'packages/quds_mail_transport/lib/quds_mail_transport.dart'
      - 'packages/quds_mail_transport/lib/src/cloud/**'
      - 'packages/quds_mail_transport/lib/src/ews/**'
      - 'packages/quds_mail_transport/test/cloud_oauth*_test.dart'
      - 'packages/quds_mail_transport/test/ews*_test.dart'
      - 'packages/quds_mail_transport/test/google_task_reader_test.dart'
      - 'packages/quds_mail_transport/pubspec.yaml'
      - 'packages/quds_office_editor/example/lib/studio_tasks*.dart'
      - 'packages/quds_office_editor/example/lib/suite_workspace.dart'
      - 'packages/quds_office_editor/example/test/studio_tasks_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.fvmrc'
      - '.github/workflows/tasks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tasks:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - quds_tasks_core
          - quds_tasks_graph
          - quds_tasks_caldav
          - quds_tasks_store
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test on Dart VM
        run: dart test --platform vm
      - name: Compile and run portable entry
        if: matrix.package != 'quds_tasks_store'
        run: |
          mkdir -p build/tasks
          dart compile js test/compile/portable_import.dart -o build/tasks/portable_import.js
          node -e 'globalThis.self = globalThis; require("./build/tasks/portable_import.js")'


  studio-tasks:
    name: Studio Tasks, provider readers and OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter pub get
      - name: Test Tasks-only authorization and loopback
        working-directory: packages/quds_mail_transport
        run: dart test test/cloud_oauth_test.dart test/cloud_oauth_loopback_test.dart
      - name: Test task readers and Exchange SOAP transport
        working-directory: packages/quds_mail_transport
        run: >-
          dart test test/google_task_reader_test.dart test/ews_provider_test.dart
          test/ews_soap_test.dart test/ews_http_test.dart
      - name: Test Studio Tasks
        working-directory: packages/quds_office_editor/example
        run: flutter test --no-pub test/studio_tasks_test.dart
