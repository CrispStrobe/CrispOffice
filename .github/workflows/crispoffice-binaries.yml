name: CrispOffice binaries

on:
  workflow_dispatch:
  push:
    tags: ['crispoffice-v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build macOS
        working-directory: packages/quds_office_editor/example
        run: flutter build macos --release
      - name: Package Hunspell and re-sign the local app
        run: |
          python3 packages/quds_proofing_hunspell/tool/build.py --native \
            --output build/hunspell-macos \
            --install-native packages/quds_office_editor/example/build/macos/Build/Products/Release/quds_office_studio.app/Contents/Frameworks \
            --install-licenses packages/quds_office_editor/example/build/macos/Build/Products/Release/quds_office_studio.app/Contents/Resources/hunspell-licenses
          codesign --force --sign - \
            packages/quds_office_editor/example/build/macos/Build/Products/Release/quds_office_studio.app/Contents/Frameworks/libquds_proofing_hunspell.dylib
          codesign --force --deep --sign - \
            --entitlements packages/quds_office_editor/example/macos/Runner/Release.entitlements \
            packages/quds_office_editor/example/build/macos/Build/Products/Release/quds_office_studio.app
      - name: Package
        run: |
          cd packages/quds_office_editor/example
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/quds_office_studio.app \
            "$GITHUB_WORKSPACE/crispoffice-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: crispoffice-macos
          path: crispoffice-macos.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !tools/proofing/spacy/**
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build Windows
        working-directory: packages/quds_office_editor/example
        run: flutter build windows --release
      - name: Package Hunspell
        run: >-
          python packages/quds_proofing_hunspell/tool/build.py --native
          --output build/hunspell-windows
          --install-native packages/quds_office_editor/example/build/windows/x64/runner/Release
          --install-licenses packages/quds_office_editor/example/build/windows/x64/runner/Release/hunspell-licenses
      - name: Package
        working-directory: packages/quds_office_editor/example
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:GITHUB_WORKSPACE\crispoffice-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: crispoffice-windows-x64
          path: crispoffice-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake g++ pkg-config
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build Linux
        working-directory: packages/quds_office_editor/example
        run: flutter build linux --release
      - name: Package Hunspell
        run: |
          python3 packages/quds_proofing_hunspell/tool/build.py --native \
            --output build/hunspell-linux \
            --install-native packages/quds_office_editor/example/build/linux/x64/release/bundle/lib \
            --install-licenses packages/quds_office_editor/example/build/linux/x64/release/bundle/hunspell-licenses
      - name: Package
        working-directory: packages/quds_office_editor/example
        run: tar czf "$GITHUB_WORKSPACE/crispoffice-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: crispoffice-linux-x64
          path: crispoffice-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Matches the checked-in Flutter 3.47.8 toolchain default.
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build and package Android Hunspell
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            python3 packages/quds_proofing_hunspell/tool/build.py --android \
            --output build/hunspell-android \
            --install-android packages/quds_office_editor/example/android/app/src/main/jniLibs/arm64-v8a \
            --install-licenses packages/quds_office_editor/example/assets/licenses/hunspell
      - name: Build Android
        working-directory: packages/quds_office_editor/example
        run: flutter build apk --release --target-platform android-arm64
      - name: Package
        working-directory: packages/quds_office_editor/example
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/crispoffice-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: crispoffice-android
          path: crispoffice-android.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build and package the bundled Hunspell WebAssembly engine
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/crispoffice-emsdk"
          "$RUNNER_TEMP/crispoffice-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/crispoffice-emsdk/emsdk" activate 4.0.20
          source "$RUNNER_TEMP/crispoffice-emsdk/emsdk_env.sh"
          python3 packages/quds_proofing_hunspell/tool/build.py --wasm \
            --output build/hunspell-web \
            --install-web packages/quds_office_editor/example/web/proofing
      - name: Build web
        working-directory: packages/quds_office_editor/example
        run: flutter build web --release --no-wasm-dry-run
      - name: Package
        working-directory: packages/quds_office_editor/example
        run: tar czf "$GITHUB_WORKSPACE/crispoffice-web.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: crispoffice-web
          path: crispoffice-web.tar.gz
          if-no-files-found: error
          retention-days: 14
