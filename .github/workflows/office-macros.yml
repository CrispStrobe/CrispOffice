name: Office macros and MCP

on:
  pull_request:
    paths:
      - 'packages/quds_office_engine/**'
      - 'packages/legacy_doc_parser/**'
      - '.github/workflows/office-macros.yml'
      - '.fvmrc'
      - 'pubspec.yaml'
  push:
    branches: [main, 'codex/mcp-aligned-macros', 'codex/vba-excel-macros']
    paths:
      - 'packages/quds_office_engine/**'
      - 'packages/legacy_doc_parser/**'
      - '.github/workflows/office-macros.yml'
      - '.fvmrc'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: sdk
        name: Read repository SDK pin
        run: python3 -c 'import json; print("flutter=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze engine
        working-directory: packages/quds_office_engine
        run: dart analyze --fatal-infos
      - name: Macro and existing command regressions
        working-directory: packages/quds_office_engine
        run: >-
          dart test
          test/office_operations_test.dart
          test/office_macro_runtime_test.dart
          test/office_macro_word_revision_guard_test.dart
          test/office_macro_language_test.dart
          test/office_vba_language_test.dart
          test/office_vba_integration_test.dart
          test/office_vba_procedures_test.dart
          test/office_vba_procedure_boundaries_test.dart
          test/office_vba_procedures_integration_test.dart
          test/office_vba_control_flow_test.dart
          test/office_vba_control_flow_boundaries_test.dart
          test/office_vba_control_flow_integration_test.dart
          test/office_vba_arrays_test.dart
          test/office_vba_arrays_boundaries_test.dart
          test/office_vba_arrays_integration_test.dart
          test/office_vba_dynamic_arrays_test.dart
          test/office_vba_dynamic_arrays_integration_test.dart
          test/office_vba_string_intrinsics_test.dart
          test/office_vba_string_intrinsics_integration_test.dart
          test/office_vba_strcomp_test.dart
          test/office_vba_word_font_colors_test.dart
          test/office_macro_word_font_colors_test.dart
          test/office_vba_word_comparison_colors_conformance_test.dart
          test/office_vba_word_comparison_colors_integration_test.dart
          test/office_vba_numeric_intrinsics_test.dart
          test/office_vba_numeric_conformance_test.dart
          test/office_vba_numeric_intrinsics_integration_test.dart
          test/office_vba_conformance_test.dart
          test/office_vba_variant_conversions_test.dart
          test/office_vba_variant_conformance_test.dart
          test/office_vba_variant_conversions_integration_test.dart
          test/office_vba_word_language_test.dart
          test/office_vba_word_conformance_test.dart
          test/office_vba_word_integration_test.dart
          test/office_vba_word_cli_test.dart
          test/office_macro_word_table_cells_test.dart
          test/office_vba_word_table_cells_test.dart
          test/office_vba_word_table_cells_conformance_test.dart
          test/office_vba_word_table_cells_integration_test.dart
          test/office_vba_word_cell_prefix_test.dart
          test/office_vba_word_cell_prefix_conformance_test.dart
          test/office_vba_word_cell_prefix_integration_test.dart
          test/office_vba_string_constants_test.dart
          test/office_macro_word_cell_prefix_test.dart
          test/office_vba_word_cell_paragraphs_test.dart
          test/office_vba_word_cell_paragraphs_conformance_test.dart
          test/office_vba_word_cell_paragraphs_integration_test.dart
          test/word_table_cell_paragraph_formatting_test.dart
          test/word_empty_formatted_run_test.dart
          test/office_macro_word_position_test.dart
          test/office_vba_word_position_test.dart
          test/office_vba_word_position_conformance_test.dart
          test/office_vba_word_position_integration_test.dart
          test/word_position_test.dart
          test/office_macro_expansion_test.dart
          test/office_macro_mcp_test.dart
          test/office_macro_cli_test.dart
          test/office_steps_test.dart
          test/word_step_atomicity_test.dart
          test/word_steps_vocabulary_test.dart
          test/style_cascade_test.dart
          test/word_structure_steps_test.dart
          test/table_grid_steps_test.dart
          test/word_table_grid_addressing_test.dart
          test/sheet_macro_preservation_test.dart
      - name: Portable JavaScript execution
        working-directory: packages/quds_office_engine
        run: |
          mkdir -p build/macros
          dart compile js -O1 tool/macros/web_smoke.dart -o build/macros/web_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_smoke.dart -o build/macros/web_vba_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_procedures_smoke.dart -o build/macros/web_vba_procedures_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_procedures_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_control_flow_smoke.dart -o build/macros/web_vba_control_flow_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_control_flow_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_arrays_smoke.dart -o build/macros/web_vba_arrays_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_arrays_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_dynamic_arrays_smoke.dart -o build/macros/web_vba_dynamic_arrays_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_dynamic_arrays_smoke.js")'
          dart compile js -O1 tool/macros/web_vba_word_smoke.dart -o build/macros/web_vba_word_smoke.js
          node -e 'globalThis.self = globalThis; require("./build/macros/web_vba_word_smoke.js")'
          WORD_POSITION_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_font_position.bas").read_bytes()).decode())')
          dart -DWORD_POSITION_BAS_BASE64="$WORD_POSITION_BAS_BASE64" tool/macros/web_vba_word_position_smoke.dart > build/macros/word-position-vm.json
          dart compile js -O1 -DWORD_POSITION_BAS_BASE64="$WORD_POSITION_BAS_BASE64" tool/macros/web_vba_word_position_smoke.dart -o build/macros/word-position.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-position.js")' > build/macros/word-position-js.json
          cmp build/macros/word-position-vm.json build/macros/word-position-js.json
          WORD_NUMERIC_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_numeric_report.bas").read_bytes()).decode())')
          dart -DWORD_NUMERIC_BAS_BASE64="$WORD_NUMERIC_BAS_BASE64" tool/macros/web_vba_word_numeric_smoke.dart > build/macros/word-numeric-vm.json
          dart compile js -O1 -DWORD_NUMERIC_BAS_BASE64="$WORD_NUMERIC_BAS_BASE64" tool/macros/web_vba_word_numeric_smoke.dart -o build/macros/word-numeric.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-numeric.js")' > build/macros/word-numeric-js.json
          cmp build/macros/word-numeric-vm.json build/macros/word-numeric-js.json
          WORD_TABLE_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_table_report.bas").read_bytes()).decode())')
          dart -DWORD_TABLE_BAS_BASE64="$WORD_TABLE_BAS_BASE64" tool/macros/web_vba_word_table_cells_smoke.dart > build/macros/word-table-vm.json
          dart compile js -O1 -DWORD_TABLE_BAS_BASE64="$WORD_TABLE_BAS_BASE64" tool/macros/web_vba_word_table_cells_smoke.dart -o build/macros/word-table.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-table.js")' > build/macros/word-table-js.json
          cmp build/macros/word-table-vm.json build/macros/word-table-js.json
          WORD_CELL_PARAGRAPHS_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_table_paragraphs.bas").read_bytes()).decode())')
          dart -DWORD_CELL_PARAGRAPHS_BAS_BASE64="$WORD_CELL_PARAGRAPHS_BAS_BASE64" tool/macros/web_vba_word_cell_paragraphs_smoke.dart > build/macros/word-cell-paragraphs-vm.json
          dart compile js -O1 -DWORD_CELL_PARAGRAPHS_BAS_BASE64="$WORD_CELL_PARAGRAPHS_BAS_BASE64" tool/macros/web_vba_word_cell_paragraphs_smoke.dart -o build/macros/word-cell-paragraphs.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-cell-paragraphs.js")' > build/macros/word-cell-paragraphs-js.json
          python3 -c 'import json; from pathlib import Path; assert json.loads(Path("build/macros/word-cell-paragraphs-vm.json").read_text()) == json.loads(Path("build/macros/word-cell-paragraphs-js.json").read_text())'
          WORD_CELL_PREFIX_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_table_prefix.bas").read_bytes()).decode())')
          dart -DWORD_CELL_PREFIX_BAS_BASE64="$WORD_CELL_PREFIX_BAS_BASE64" tool/macros/web_vba_word_cell_prefix_smoke.dart > build/macros/word-cell-prefix-vm.json
          dart compile js -O1 -DWORD_CELL_PREFIX_BAS_BASE64="$WORD_CELL_PREFIX_BAS_BASE64" tool/macros/web_vba_word_cell_prefix_smoke.dart -o build/macros/word-cell-prefix.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-cell-prefix.js")' > build/macros/word-cell-prefix-js.json
          python3 -c 'import json; from pathlib import Path; assert json.loads(Path("build/macros/word-cell-prefix-vm.json").read_text()) == json.loads(Path("build/macros/word-cell-prefix-js.json").read_text())'
          dart tool/macros/web_vba_strcomp_smoke.dart > build/macros/strcomp-vm.json
          dart compile js -O1 tool/macros/web_vba_strcomp_smoke.dart -o build/macros/strcomp.js
          node -e 'globalThis.self = globalThis; require("./build/macros/strcomp.js")' > build/macros/strcomp-js.json
          cmp build/macros/strcomp-vm.json build/macros/strcomp-js.json
          WORD_COMPARISON_COLORS_BAS_BASE64=$(python3 -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("example/macros/word_comparison_colors.bas").read_bytes()).decode())')
          dart -DWORD_COMPARISON_COLORS_BAS_BASE64="$WORD_COMPARISON_COLORS_BAS_BASE64" tool/macros/web_vba_word_comparison_colors_smoke.dart > build/macros/word-comparison-colors-vm.json
          dart compile js -O1 -DWORD_COMPARISON_COLORS_BAS_BASE64="$WORD_COMPARISON_COLORS_BAS_BASE64" tool/macros/web_vba_word_comparison_colors_smoke.dart -o build/macros/word-comparison-colors.js
          node -e 'globalThis.self = globalThis; require("./build/macros/word-comparison-colors.js")' > build/macros/word-comparison-colors-js.json
          cmp build/macros/word-comparison-colors-vm.json build/macros/word-comparison-colors-js.json
      - name: Shared language conformance on VM and JavaScript
        working-directory: packages/quds_office_engine
        run: |
          set -e
          mkdir -p build/macros
          for suite in string_intrinsics_v1 variant_conversions_v1 variant_composition_v1 word_paragraphs_v1 word_font_position_v1 word_numeric_intrinsics_v1 word_table_cells_v1 word_comparison_colors_v1 word_cell_paragraphs_v1 word_cell_prefix_v1; do
            VBA_CASES_BASE64=$(python3 -c 'import base64,sys; from pathlib import Path; print(base64.b64encode(Path(sys.argv[1]).read_bytes()).decode())' "test/fixtures/vba_conformance/${suite}.json")
            dart --packages=../../.dart_tool/package_config.json -DVBA_CONFORMANCE_BASE64="$VBA_CASES_BASE64" tool/macros/web_vba_conformance.dart > "build/macros/${suite}-vm.json"
            dart compile js -O1 --packages=../../.dart_tool/package_config.json -DVBA_CONFORMANCE_BASE64="$VBA_CASES_BASE64" tool/macros/web_vba_conformance.dart -o "build/macros/${suite}.js"
            node -e 'globalThis.self = globalThis; require(process.argv[1])' "./build/macros/${suite}.js" > "build/macros/${suite}-js.json"
            cmp "build/macros/${suite}-vm.json" "build/macros/${suite}-js.json"
          done
