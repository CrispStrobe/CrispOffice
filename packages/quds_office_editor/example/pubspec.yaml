name: quds_office_studio
description: Full Office workspace demo hosted on quds_office_editor.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  shared_preferences: ^2.5.3
  pointycastle: ^4.0.0
  ffi: ^2.1.4
  meta: ^1.17.0
  crypto: ^3.0.7
  http: ^1.3.0
  intl: ^0.20.2
  web: ^1.1.2
  file_picker: ^10.3.10
  desktop_drop: ^0.7.1
  cross_file: ^0.3.5+5
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter:
    sdk: flutter
  quds_office_editor:
    path: ..
  quds_office_engine:
    path: ../../quds_office_engine
  quds_proofing_harper:
    path: ../../quds_proofing_harper
  quds_proofing_hunspell:
    path: ../../quds_proofing_hunspell
  quds_arabic_morph:
    path: ../../quds_arabic_morph
  quds_language_id:
    path: ../../quds_language_id
  quds_proofing_spacy:
    path: ../../quds_proofing_spacy
  quds_mail_core:
    path: ../../quds_mail_core
  quds_mail_transport:
    path: ../../quds_mail_transport
  enough_mail:
    path: ../../../third_party/enough_mail
  quds_mail_mime:
    path: ../../quds_mail_mime
  quds_mail_store:
    path: ../../quds_mail_store
  quds_tasks_core: ^0.1.0
  quds_tasks_caldav: ^0.1.0
  quds_tasks_graph: ^0.1.0
  quds_tasks_store: ^0.1.0
  sqlite3: 3.9.1
  quds_mail_ui:
    path: ../../quds_mail_ui
  window_manager: ^0.5.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^9.0.1

dev_dependencies:
  drift: 2.35.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/licenses/hunspell/
    - assets/licenses/arabic_morph/
    - assets/licenses/open_font_pack/
    - assets/licenses/language_id/
    - assets/licenses/harper/
    - assets/licenses/spacy/
    - fonts/
