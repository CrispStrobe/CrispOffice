name: quds_office_studio
description: Full Office workspace demo hosted on quds_office_editor.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  http: ^1.3.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  quds_office_editor:
    path: ..
  quds_office_engine:
    path: ../../quds_office_engine
  quds_proofing_harper:
    path: ../../quds_proofing_harper
  quds_proofing_hunspell:
    path: ../../quds_proofing_hunspell
  quds_arabic_morph:
    path: ../../quds_arabic_morph
  quds_proofing_spacy:
    path: ../../quds_proofing_spacy
  quds_mail_core:
    path: ../../quds_mail_core
  quds_mail_transport:
    path: ../../quds_mail_transport
  enough_mail:
    path: ../../../third_party/enough_mail
  quds_mail_mime:
    path: ../../quds_mail_mime
  quds_mail_ui:
    path: ../../quds_mail_ui
  window_manager: ^0.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/licenses/hunspell/
    - assets/licenses/arabic_morph/
    - fonts/
