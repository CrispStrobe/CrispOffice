name: quds_office_suite
description: >-
  Production-grade Office Open XML suite — pure Dart engine plus
  Flutter RenderBox editors for Word, Excel, and PowerPoint.
publish_to: none
homepage: https://github.com/MohammedAsaadAsaad/quds_office_suite
repository: https://github.com/MohammedAsaadAsaad/quds_office_suite
issue_tracker: https://github.com/MohammedAsaadAsaad/quds_office_suite/issues

environment:
  sdk: ^3.12.0

workspace:
  - packages/quds_tasks_core
  - packages/quds_tasks_graph
  - packages/quds_mail_core
  - packages/quds_mail_mime
  - packages/quds_mail_store
  - packages/quds_mail_transport
  - packages/quds_mail_ui
  - packages/quds_mail_ui/example
  - packages/legacy_doc_parser
  - packages/quds_office_engine
  - packages/quds_proofing_harper
  - packages/quds_proofing_gector
  - packages/quds_proofing_spacy
  - packages/quds_proofing_hunspell
  - packages/quds_arabic_morph
  - packages/quds_language_id
  - packages/quds_office_engine/example
  - packages/quds_reports
  - packages/quds_office_editor
  - packages/quds_office_editor/example
  - apps/quds_report_studio
